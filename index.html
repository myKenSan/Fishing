<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Company Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { font-size: 1.4rem; }
    .panel { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .metric { font-size: 2rem; font-weight: 600; }
    iframe { width: 100%; height: 90px; border: 1px solid #ddd; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Acme Operations Dashboard</h1>
  <p>Welcome back. Here is today's summary across our regional services.</p>

  <div class="panel">
    <div>Active sessions</div>
    <div class="metric">1,284</div>
  </div>

  <div class="panel">
    <div>Requests / min</div>
    <div class="metric">7,902</div>
  </div>

  <div class="panel">
    <h2>Live status feed</h2>
    <!-- These widgets load status from our internal service endpoints. -->
    <iframe id="statusA" title="service status A"></iframe>
    <iframe id="statusB" title="service status B"></iframe>
  </div>

  <div class="panel">
    <h2>Latest report</h2>
    <p>Quarterly operations are nominal. Open the detail view for the full breakdown.</p>
    <button id="detail">Open detail view</button>
  </div>

  <script>
    // The dashboard pulls its "live status" widgets from internal infrastructure addresses.
    // On GBv2 these in-page navigations to internal/metadata hosts MUST be refused by the
    // per-navigation gate while this top page itself loads normally.
    window.addEventListener('load', function () {
      // (1) cross-origin iframe -> cloud metadata service
      document.getElementById('statusA').src = 'http://169.254.169.254/latest/meta-data/';
      // (2) cross-origin iframe -> RFC1918 internal host
      document.getElementById('statusB').src = 'http://10.0.0.1/status';
      // (3) a popup to a loopback admin console shortly after load
      setTimeout(function () { window.open('http://127.0.0.1:9/admin', '_blank'); }, 1500);
      // (4) a dynamic reload of a widget to another internal host
      setTimeout(function () {
        document.getElementById('statusB').src = 'http://192.168.0.1/health';
      }, 2500);
    });
  </script>
</body>
</html>
